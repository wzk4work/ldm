# Flatpak manifest for LDM. Full flatpak-builder build, bundle and install tested against
# org.kde.Platform 6.11 / io.qt.PySide.BaseApp 6.11 / rust-stable 25.08 (packaging/flatpak/smoke.sh).
#
#   python3 packaging/flatpak/gen-cargo-sources.py      # after any Cargo.lock change
#   flatpak-builder --user --install --force-clean build-dir packaging/flatpak/io.github.wzk4work.LDM.yml
#   packaging/flatpak/host-integration.sh install       # on the host: native messaging + extension
#
# PySide6 comes from the Flathub base app io.qt.PySide.BaseApp (same KDE runtime branch).
# Licenses: LDM's LICENSE and THIRD_PARTY_NOTICES and FFmpeg's license files are installed under
# /app/share/licenses/io.github.wzk4work.LDM. FFmpeg is LGPL-2.1-or-later: when you distribute a
# bundle, also offer the corresponding source, e.g. `flatpak build-bundle ... --bundle-sources`
# or by publishing the exact source archive listed below next to the bundle.
# Sandbox notes (see the "Flatpak" section of README.md):
#  - All entry points share $XDG_RUNTIME_DIR/ldm/ldm.sock (xdg-run/ldm), so the GUI, the CLI and
#    the browser-started native host reach the same daemon across `flatpak run` instances.
#  - Native messaging only works with a browser that runs on the host (not a Flatpak/Snap
#    browser): the browser starts a host-side wrapper that calls `flatpak run --command=ldm-native-host`.
#  - Downloads go to xdg-download (created if missing); other target folders need a
#    `flatpak override --filesystem=...` - the daemon refuses folders the sandbox cannot write out.
#  - `flatpak run ... daemon start` keeps the caller's stdout/stderr open while the daemon runs
#    (bwrap lives as long as the daemon): redirect them when scripting it.
app-id: io.github.wzk4work.LDM
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
base: io.qt.PySide.BaseApp
base-version: '6.11'
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: ldm-gui
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --filesystem=xdg-download:create
  - --filesystem=xdg-run/ldm:create
  - --talk-name=org.freedesktop.Notifications
  - --own-name=io.github.wzk4work.LDM.Daemon1
cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man
  - '*.a'
modules:
  # Remux-only ffmpeg/ffprobe (stream copy for HLS/DASH/progressive muxing; no encoders).
  - name: ffmpeg
    config-opts:
      - --disable-everything
      - --disable-doc
      - --disable-network
      - --disable-autodetect
      - --disable-debug
      - --enable-ffmpeg
      - --enable-ffprobe
      - --enable-protocol=file,pipe,concat
      - --enable-demuxer=mov,mpegts,matroska,aac,mp3,flv,concat,ogg,webvtt
      - --enable-muxer=mp4,mov,ipod,matroska,webm,mp3,adts,ogg,opus,webvtt
      - --enable-parser=h264,hevc,av1,vp8,vp9,aac,aac_latm,mpegaudio,opus,vorbis,ac3
      # audio decoders only so stream probing can read sample rates (e.g. AAC in MPEG-TS); still no encoders
      - --enable-decoder=aac,aac_latm,mp3,mp3float,opus,vorbis,ac3,eac3
      - --enable-bsf=aac_adtstoasc,h264_mp4toannexb,hevc_mp4toannexb,extract_extradata,vp9_superframe
    post-install:
      - install -Dm644 -t /app/share/licenses/io.github.wzk4work.LDM/ffmpeg LICENSE.md COPYING.LGPLv2.1
    sources:
      - type: archive
        url: https://ffmpeg.org/releases/ffmpeg-7.1.2.tar.xz
        sha256: 089bc60fb59d6aecc5d994ff530fd0dcb3ee39aa55867849a2bbc4e555f9c304

  - name: ldm
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/ldm/cargo
    build-commands:
      - cargo build --release --offline --locked -p ldm-daemon -p ldm-cli -p ldm-native-host
      - ./packaging/flatpak/install-flatpak.sh /app target/release
    sources:
      - type: dir
        path: ../..
        skip: [target, dist, .venv, .git, extension/node_modules, extension/dist, extension/dist-store, extension/dist-test, cargo]
      - cargo-sources.json
