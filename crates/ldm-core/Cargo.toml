[package]
name = "ldm-core"
description = "LDM core: download engine, HLS/DASH media pipeline, storage, queue manager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
base64.workspace = true
ldm-ipc = { path = "../ldm-ipc" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
futures-util.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "socks", "http2"] }
rusqlite = { version = "0.32", features = ["bundled"] }
toml = "0.8"
url = "2"
aes = "0.8"
cbc = "0.1"
hex = "0.4"
sha2 = "0.10"
roxmltree = "0.20"
rand = "0.8"
percent-encoding = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
libc = "0.2"
bytes = "1"
md-5 = "0.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "logging", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1"
miniz_oxide = { version = "0.9", default-features = false, features = ["with-alloc"] }

[dev-dependencies]
sha2 = "0.10"
hex = "0.4"
tempfile = "3"
ldm-testsrv = { path = "../../tools/ldm-testsrv" }
