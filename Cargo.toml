[workspace]
resolver = "3"
members = [
  "crates/ldm-ipc",
  "crates/ldm-core",
  "crates/ldm-ws-bridge",
  "crates/ldm-daemon",
  "crates/ldm-native-host",
  "crates/ldm-cli",
  "tools/ldm-testsrv",
]

[workspace.package]
version = "0.9.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["Nicolas"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
base64 = "0.22"

[profile.release]
strip = true
lto = "thin"
