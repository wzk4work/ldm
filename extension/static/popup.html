<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 13px system-ui, sans-serif; width: 380px; margin: 0; padding: 10px; color: #202124; }
  h1 { font-size: 15px; margin: 0 0 8px; }
  .status { margin-bottom: 8px; }
  .ok { color: #188038; } .bad { color: #d93025; }
  ul { list-style: none; padding: 0; margin: 0; max-height: 300px; overflow: auto; }
  li { padding: 5px 0; border-bottom: 1px solid #eee; }
  li .top { display: flex; justify-content: space-between; gap: 6px; }
  li span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  li select { margin-top: 4px; width: 100%; }
  li.adish span { color: #9aa0a6; }
  li.alt { padding-left: 16px; }
  .adtag { display: inline-block; margin-right: 5px; padding: 0 3px; border: 1px solid #bdc1c6; border-radius: 3px; font-size: 11px; color: #80868b; }
  button { cursor: pointer; }
  .row { margin-top: 8px; }
  pre { max-height: 160px; overflow: auto; font-size: 11px; background: #f1f3f4; padding: 4px; }
</style>
</head>
<body>
  <h1>LDM</h1>
  <div class="status" id="status"></div>
  <div id="empty" data-i18n="popupNoMedia"></div>
  <ul id="list"></ul>
  <button id="ytdlp" style="display:none;width:100%;margin:4px 0"></button>
  <div class="row"><label><input type="checkbox" id="intercept"> <span data-i18n="popupIntercept"></span></label></div>
  <div class="row"><label><input type="checkbox" id="tabPaused"> <span data-i18n="popupPauseTab"></span></label></div>
  <div class="row"><label><input type="checkbox" id="siteDisabled"> <span data-i18n="popupDisableSite"></span> <b id="site"></b></label></div>
  <div class="row"><button id="reconnect" data-i18n="popupReconnect"></button> <button id="proxySync" data-i18n="popupProxySync"></button></div>
  <details class="row"><summary data-i18n="popupAdvanced"></summary>
    <label><input type="checkbox" id="pageHooks"> <span data-i18n="popupPageHooks"></span></label>
  </details>
  <details id="debug" style="display:none"><summary>debug</summary><pre id="debugText"></pre></details>
  <script src="popup.js"></script>
</body>
</html>
