name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg xvfb xauth dbus dbus-x11 desktop-file-utils squashfs-tools \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-xinerama0 libxcb-randr0 libxcb-render-util0 libxcb-image0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python environment
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt

      - name: Third-party notices are up to date
        run: python3 scripts/gen_third_party_notices.py --check

      - name: scripts/check.sh
        run: xvfb-run -a dbus-run-session -- scripts/check.sh
