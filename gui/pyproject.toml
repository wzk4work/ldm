[project]
name = "ldm-gui"
version = "0.9.0"
description = "LDM 桌面图形界面 (PySide6)"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["PySide6>=6.5"]

[project.scripts]
ldm-gui = "ldm_gui.app:main"

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
